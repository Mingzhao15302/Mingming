<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉鑫科技视频管理器</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
    <script src="app.js" type="module" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-main">
        <h1>辉鑫科技视频管理器</h1>
        <p class="tagline">企业级视频资产中心 · 本地化部署 · 安全可控</p>
      </div>
      <div class="status-pill" id="global-status">
        <span class="indicator"></span>
        <span class="status-text">连接中...</span>
      </div>
      <nav class="tab-nav">
        <button class="tab-button active" data-target="management">视频管理</button>
        <button class="tab-button" data-target="dashboard">仪表板</button>
      </nav>
    </header>

    <main>
      <section id="management" class="tab-section active">
        <div class="panel status-panel">
          <div class="panel-header">
            <h2>文件服务器状态</h2>
            <button id="refresh-status" class="secondary">立即刷新</button>
          </div>
          <div class="status-grid" id="management-status"></div>
        </div>

        <div class="panel">
          <h2>批量上传视频</h2>
          <p class="hint">
            支持 1 ~ 200MB 以内的视频文件，单次可导入 500+ 文件。文件在服务器端持久保存，可跨浏览器、跨设备访问。
          </p>
          <label class="upload-label">
            <input id="video-upload" type="file" accept="video/*" multiple hidden />
            <span class="upload-action">选择视频文件</span>
          </label>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>视频列表</h2>
            <div class="panel-actions">
              <button id="select-all">全选</button>
              <button id="clear-selection" class="secondary">取消选择</button>
              <button id="delete-selected" class="danger">删除所选</button>
              <button id="delete-all" class="danger">全部删除</button>
              <button id="export-csv" class="secondary">导出 CSV</button>
              <label class="import-label">
                导入 CSV
                <input id="import-csv" type="file" accept=".csv" hidden />
              </label>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>
                    <input type="checkbox" id="select-all-checkbox" />
                  </th>
                  <th>预览</th>
                  <th>文件名</th>
                  <th>客户名称</th>
                  <th>物料信息</th>
                  <th>型号系列</th>
                  <th>灌装重量</th>
                  <th>压盖方式</th>
                  <th>输送方式</th>
                  <th>缓存方式</th>
                  <th>VOC 要求</th>
                  <th>防爆要求</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="video-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="dashboard" class="tab-section">
        <div class="dashboard-banner">
          <div>
            <h2>辉鑫科技视频资产仪表板</h2>
            <p>实时洞察各类产品线视频资产分布情况，支持按产品分类快速筛选与预览。</p>
          </div>
          <img src="https://cdn.jsdelivr.net/gh/tabler/tabler-icons/icons/video.svg" alt="video icon" />
        </div>

        <div class="panel status-panel">
          <div class="panel-header">
            <h2>文件服务器状态</h2>
            <span class="status-legend" id="dashboard-status"></span>
          </div>
          <div class="status-grid" id="dashboard-status-grid"></div>
        </div>

        <div class="panel">
          <h2>视频资产统计</h2>
          <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div class="panel">
          <h2>筛选条件</h2>
          <form id="dashboard-filters" class="filters">
            <label>
              型号系列
              <select name="series"></select>
            </label>
            <label>
              灌装重量
              <select name="weight"></select>
            </label>
            <label>
              压盖方式
              <select name="capping"></select>
            </label>
            <label>
              输送方式
              <select name="conveyor"></select>
            </label>
            <label>
              缓存方式
              <select name="buffer"></select>
            </label>
            <label>
              VOC 要求
              <select name="voc"></select>
            </label>
            <label>
              防爆要求
              <select name="explosion"></select>
            </label>
            <button type="reset" class="secondary">重置筛选</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>分类分布</h2>
            <div class="view-toggle">
              <button data-chart="radar" class="active">雷达图</button>
              <button data-chart="bar">条形图</button>
            </div>
          </div>
          <canvas id="distribution-chart" height="220"></canvas>
        </div>

        <div class="panel">
          <h2>视频预览</h2>
          <div id="preview-grid" class="preview-grid"></div>
        </div>
      </section>
    </main>

    <dialog id="edit-dialog">
      <form method="dialog" id="edit-form">
        <header class="dialog-header">
          <button
            type="button"
            id="edit-prev"
            class="edge-button edge-button--left"
            aria-label="上一个视频"
          >
            ◀
          </button>
          <div class="dialog-header-main">
            <h3 id="edit-dialog-title">修改视频信息</h3>
            <p class="dialog-subtitle" id="edit-dialog-subtitle">请选择要编辑的视频</p>
          </div>
          <div class="dialog-window-controls">
            <button type="button" id="edit-minimize" class="icon-button" aria-label="最小化">
              ▁
            </button>
            <button type="button" id="edit-close" class="icon-button" aria-label="关闭">
              ×
            </button>
          </div>
          <button
            type="button"
            id="edit-next"
            class="edge-button edge-button--right"
            aria-label="下一个视频"
          >
            ▶
          </button>
        </header>

        <div class="dialog-body">
          <label>
            文件名
            <input type="text" name="name" required />
          </label>
          <label>
            客户名称
            <input type="text" name="clientName" />
          </label>
          <label>
            物料信息
            <input type="text" name="material" />
          </label>
          <label>
            产品分类
            <div class="dialog-grid">
              <label>
                型号系列
                <select name="series"></select>
              </label>
              <label>
                灌装重量
                <select name="weight"></select>
              </label>
              <label>
                压盖方式
                <select name="capping"></select>
              </label>
              <label>
                输送方式
                <select name="conveyor"></select>
              </label>
              <label>
                缓存方式
                <select name="buffer"></select>
              </label>
              <label>
                VOC 要求
                <select name="voc"></select>
              </label>
              <label>
                防爆要求
                <select name="explosion"></select>
              </label>
            </div>
          </label>
        </div>

        <footer class="dialog-footer">
          <button type="button" id="edit-cancel" class="secondary">关闭</button>
          <button type="submit" class="primary">保存</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
