<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉鑫科技视频管理器</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="app.js" type="module" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-main">
        <h1>辉鑫科技视频管理器</h1>
        <p class="tagline">企业级视频资产中心 · 本地化部署 · 安全可控</p>
      </div>
      <div class="status-pill" id="global-status">
        <span class="indicator"></span>
        <span class="status-text">连接中...</span>
      </div>
    </header>

    <main>
      <section id="management" class="tab-section active">
        <div class="panel status-panel">
          <div class="panel-header">
            <h2>文件服务器状态</h2>
            <button id="refresh-status" class="secondary">立即刷新</button>
          </div>
          <div class="status-grid" id="management-status"></div>
        </div>

        <div class="panel">
          <h2>批量上传视频</h2>
          <p class="hint">
            支持 1 ~ 200MB 以内的视频文件，单次可导入 500+ 文件。文件在服务器端持久保存，可跨浏览器、跨设备访问。
          </p>
          <label class="upload-label">
            <input id="video-upload" type="file" accept="video/*" multiple hidden />
            <span class="upload-action">选择视频文件</span>
          </label>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>视频列表</h2>
            <div class="panel-actions">
              <button id="select-all">全选</button>
              <button id="clear-selection" class="secondary">取消选择</button>
              <button id="delete-selected" class="danger">删除所选</button>
              <button id="delete-all" class="danger">全部删除</button>
              <button id="export-csv" class="secondary">导出 CSV</button>
              <label class="import-label">
                导入 CSV
                <input id="import-csv" type="file" accept=".csv" hidden />
              </label>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>
                    <input type="checkbox" id="select-all-checkbox" />
                  </th>
                  <th>预览</th>
                  <th>文件名</th>
                  <th>客户名称</th>
                  <th>物料信息</th>
                  <th>型号系列</th>
                  <th>灌装重量</th>
                  <th>压盖方式</th>
                  <th>输送方式</th>
                  <th>缓存方式</th>
                  <th>VOC 要求</th>
                  <th>防爆要求</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="video-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>

    <dialog id="edit-dialog">
      <form method="dialog" id="edit-form">
        <header class="dialog-header">
          <button type="button" id="edit-prev" class="icon-button" aria-label="上一个">
            ◀
          </button>
          <h3>修改视频信息</h3>
          <button type="button" id="edit-next" class="icon-button" aria-label="下一个">
            ▶
          </button>
        </header>

        <div class="dialog-body">
          <label>
            文件名
            <input type="text" name="name" required />
          </label>
          <label>
            客户名称
            <input type="text" name="clientName" />
          </label>
          <label>
            物料信息
            <input type="text" name="material" />
          </label>
          <label>
            产品分类
            <div class="dialog-grid">
              <label>
                型号系列
                <select name="series"></select>
              </label>
              <label>
                灌装重量
                <select name="weight"></select>
              </label>
              <label>
                压盖方式
                <select name="capping"></select>
              </label>
              <label>
                输送方式
                <select name="conveyor"></select>
              </label>
              <label>
                缓存方式
                <select name="buffer"></select>
              </label>
              <label>
                VOC 要求
                <select name="voc"></select>
              </label>
              <label>
                防爆要求
                <select name="explosion"></select>
              </label>
            </div>
          </label>
        </div>

        <footer class="dialog-footer">
          <button type="button" id="edit-cancel" class="secondary">取消</button>
          <button type="submit" class="primary">保存</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
