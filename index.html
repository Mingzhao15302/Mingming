<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频管理器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🎬</span>
          <div>
            <p class="brand-title">视频管理器</p>
            <p class="brand-subtitle">全流程视频资产管理与分析</p>
          </div>
        </div>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-btn is-active" data-target="management">视频管理</button>
          <button class="nav-btn" data-target="dashboard">仪表板</button>
        </nav>
        <div class="header-actions">
          <label class="upload-btn">
            <input id="video-input" type="file" accept="video/mp4" multiple />
            <span>导入MP4</span>
          </label>
        </div>
      </header>

      <main class="app-main">
        <section id="management" class="panel is-active" aria-labelledby="management-title">
          <header class="panel-header">
            <div>
              <h1 id="management-title">视频管理</h1>
              <p class="panel-description">集中查看、编辑及导出上传的视频资料</p>
            </div>
            <button class="secondary-btn" id="export-btn">导出CSV</button>
          </header>

          <div class="upload-dropzone" id="upload-dropzone" tabindex="0">
            <div class="dropzone-inner">
              <p class="dropzone-title">拖拽MP4文件至此，或点击上方按钮导入</p>
              <p class="dropzone-support">支持批量上传，文件将保留在本地浏览器会话中</p>
            </div>
          </div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th scope="col">文件名</th>
                  <th scope="col">客户名称</th>
                  <th scope="col">物料信息</th>
                  <th scope="col">产品分类</th>
                  <th scope="col">预览</th>
                  <th scope="col" class="text-right">操作</th>
                </tr>
              </thead>
              <tbody id="video-table"></tbody>
            </table>
            <p id="empty-state" class="empty-state">暂无视频，请先上传。</p>
          </div>
        </section>

        <section id="dashboard" class="panel" aria-labelledby="dashboard-title">
          <header class="panel-header">
            <div>
              <h1 id="dashboard-title">仪表板</h1>
              <p class="panel-description">按分类维度筛选，洞察进度分布并快速预览视频</p>
            </div>
            <div class="chart-toggle" role="group" aria-label="图表类型">
              <button class="toggle-btn is-active" data-chart="radar">雷达图</button>
              <button class="toggle-btn" data-chart="bar">条形图</button>
            </div>
          </header>

          <form class="filter-grid" id="filter-form">
            <label>
              <span>型号系列</span>
              <select name="modelSeries">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>灌装重量</span>
              <select name="fillWeight">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>压盖方式</span>
              <select name="cappingMethod">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>输送方式</span>
              <select name="conveyingMethod">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>缓存方式</span>
              <select name="bufferMethod">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>VOC要求</span>
              <select name="vocRequirement">
                <option value="">全部</option>
              </select>
            </label>
            <label>
              <span>防爆要求</span>
              <select name="explosionProof">
                <option value="">全部</option>
              </select>
            </label>
          </form>

          <div class="dashboard-grid">
            <div class="chart-card">
              <p id="chart-unavailable" class="empty-state" hidden>
                图表功能需要联网加载 Chart.js，当前不可用。
              </p>
              <canvas id="distribution-chart" aria-label="分类进度分布图" role="img"></canvas>
            </div>
            <div class="preview-card">
              <header class="preview-header">
                <h2>视频预览</h2>
                <p class="preview-count"><span id="preview-count">0</span> 条符合筛选</p>
              </header>
              <div class="preview-list" id="preview-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="edit-dialog" class="modal">
      <form method="dialog" class="modal-content" id="edit-form">
        <header class="modal-header">
          <h2>编辑视频信息</h2>
        </header>
        <div class="modal-body">
          <label>
            <span>文件名</span>
            <input type="text" name="fileName" required />
          </label>
          <label>
            <span>客户名称</span>
            <input type="text" name="customerName" placeholder="请输入客户名称" />
          </label>
          <label>
            <span>物料信息</span>
            <input type="text" name="materialInfo" placeholder="请输入物料信息" />
          </label>
          <label>
            <span>型号系列</span>
            <select name="modelSeries"></select>
          </label>
          <label>
            <span>灌装重量</span>
            <select name="fillWeight"></select>
          </label>
          <label>
            <span>压盖方式</span>
            <select name="cappingMethod"></select>
          </label>
          <label>
            <span>输送方式</span>
            <select name="conveyingMethod"></select>
          </label>
          <label>
            <span>缓存方式</span>
            <select name="bufferMethod"></select>
          </label>
          <label>
            <span>VOC要求</span>
            <select name="vocRequirement"></select>
          </label>
          <label>
            <span>防爆要求</span>
            <select name="explosionProof"></select>
          </label>
        </div>
        <footer class="modal-footer">
          <button type="button" class="secondary-btn" data-action="cancel">取消</button>
          <button type="submit" class="primary-btn">保存</button>
        </footer>
      </form>
    </dialog>

    <dialog id="preview-dialog" class="modal preview-modal">
      <div class="modal-content">
        <header class="modal-header">
          <h2>视频预览</h2>
        </header>
        <div class="modal-body">
          <video controls preload="metadata"></video>
        </div>
        <footer class="modal-footer">
          <button type="button" class="primary-btn" data-preview-close>关闭</button>
        </footer>
      </div>
    </dialog>

    <template id="video-row-template">
      <tr>
        <td data-field="fileName"></td>
        <td data-field="customerName"></td>
        <td data-field="materialInfo"></td>
        <td data-field="classification"></td>
        <td>
          <button class="link-btn" data-action="preview">预览</button>
        </td>
        <td class="text-right">
          <div class="table-actions">
            <button class="link-btn" data-action="edit">修改</button>
            <button class="link-btn danger" data-action="delete">删除</button>
          </div>
        </td>
      </tr>
    </template>

    <template id="preview-card-template">
      <article class="preview-item">
        <header>
          <h3 data-field="title"></h3>
          <p data-field="meta"></p>
        </header>
        <video controls preload="metadata"></video>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
