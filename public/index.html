<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉云易达 OS - 视频浏览</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Raleway:wght@300;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background"></div>
    <header class="hero glass">
      <div class="hero-text">
        <h1>辉云易达 OS</h1>
        <p>全端适配的视频内容操作系统，助力团队高效协作。</p>
      </div>
      <nav class="hero-actions">
        <a class="primary-btn" href="login.html">控制台登录</a>
      </nav>
    </header>

    <main class="content">
      <section class="filters glass">
        <h2>智能筛选</h2>
        <div class="filter-grid">
          <label>
            <span>分类</span>
            <select id="filterCategory">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>功能模块</span>
            <select id="filterModule">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>桶型</span>
            <select id="filterBucket">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            <span>标签</span>
            <select id="filterTag">
              <option value="">全部</option>
            </select>
          </label>
        </div>
      </section>

      <section class="gallery" id="videoGallery" aria-live="polite"></section>
    </main>

    <footer class="footer glass">
      <p>© 2024 辉云易达 OS · 液态玻璃交互体验</p>
    </footer>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
