<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉云易达 OS - 控制台</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Raleway:wght@300;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background"></div>
    <header class="top-bar glass">
      <div class="brand">
        <h1>辉云易达 OS 控制台</h1>
        <p>批量导入、智能分类、极速导出</p>
      </div>
      <nav class="actions">
        <a class="link" href="index.html">返回浏览页</a>
        <button id="logoutBtn" class="secondary-btn">退出登录</button>
      </nav>
    </header>

    <main class="dashboard">
      <section class="panel glass">
        <h2>导入管理</h2>
        <div class="import-actions">
          <label class="primary-btn file-btn">
            批量导入视频
            <input type="file" id="videoUploader" multiple accept="video/*" />
          </label>
          <label class="secondary-btn file-btn">
            导入 CSV
            <input type="file" id="csvUploader" accept=".csv" />
          </label>
          <button id="exportCsv" class="primary-btn hollow">导出 CSV</button>
        </div>
        <p class="hint">导入的视频会自动保存到服务器 videos 目录，并写入数据仓库。</p>
      </section>

      <section class="panel glass">
        <div class="panel-header">
          <h2>视频列表</h2>
          <span id="videoTotal" class="badge">0</span>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>文件名</th>
                <th>分类</th>
                <th>功能模块</th>
                <th>桶型</th>
                <th>标签</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="videoTable"></tbody>
          </table>
        </div>
      </section>
    </main>

    <section id="editModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content glass">
        <header>
          <h3>编辑分类信息</h3>
          <button id="closeModal" class="icon-btn" aria-label="关闭">×</button>
        </header>
        <form id="editForm">
          <label class="input-group">
            <span>分类</span>
            <input type="text" id="editCategory" placeholder="例如：培训 / 市场" />
          </label>
          <label class="input-group">
            <span>功能模块</span>
            <input type="text" id="editModule" placeholder="例如：新品发布" />
          </label>
          <label class="input-group">
            <span>桶型</span>
            <input type="text" id="editBucket" placeholder="例如：旗舰级" />
          </label>
          <label class="input-group">
            <span>标签</span>
            <input type="text" id="editTags" placeholder="多个标签用逗号分隔" />
          </label>
          <footer class="modal-footer">
            <button type="button" id="cancelEdit" class="secondary-btn">取消</button>
            <button type="submit" class="primary-btn">保存</button>
          </footer>
        </form>
      </div>
    </section>

    <script src="js/dashboard.js" type="module"></script>
  </body>
</html>
