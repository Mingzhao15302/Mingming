<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉云易达 OS - 登录</title>
    <link rel="stylesheet" href="css/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Raleway:wght@300;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background"></div>
    <main class="login-shell">
      <section class="login-panel glass">
        <header class="panel-header">
          <h1>辉云易达 OS</h1>
          <p>欢迎回来，请登录管理您的视频内容。</p>
        </header>
        <form id="loginForm" class="panel-body">
          <label class="input-group">
            <span>账号</span>
            <input type="text" id="username" placeholder="请输入账号" autocomplete="username" required />
          </label>
          <label class="input-group">
            <span>密码</span>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required />
          </label>
          <button type="submit" class="primary-btn">登录</button>
          <p id="error" class="error-message" aria-live="assertive"></p>
        </form>
      </section>
    </main>
    <script src="js/login.js" type="module"></script>
  </body>
</html>
