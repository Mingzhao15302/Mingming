<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉鑫科技视频管理系统 - 视频浏览</title>
  </head>
  <body class="gallery-body fade-in">
    <div class="background-glow"></div>
    <div class="gallery-container">
      <header class="gallery-header glass-card">
        <div>
          <h1>辉鑫科技视频库</h1>
          <p>通过多维筛选快速查找案例，随时播放预览</p>
        </div>
        <div class="header-links">
          <a href="/login" class="primary-btn">控制台登录</a>
        </div>
      </header>

      <section class="filters glass-card">
        <div class="filters-grid" id="primaryDropdown"></div>
        <div class="toggle-wrapper">
          <button id="toggleFilters" class="toggle-filters">
            <span class="label">展开更多分类</span>
            <span class="icon">▼</span>
          </button>
        </div>
        <div class="filters-grid hidden" id="extendedDropdown"></div>
        <div class="multi-section hidden" id="multiFilters"></div>
        <div class="filters-actions">
          <button id="resetFilters" class="secondary-btn">重置筛选</button>
        </div>
      </section>

      <section class="video-grid" id="videoGrid"></section>
      <p id="noResult" class="no-result hidden">暂无符合条件的视频，尝试调整筛选条件。</p>
    </div>

    <script type="module" src="/src/pages/home/main.js"></script>
  </body>
</html>
