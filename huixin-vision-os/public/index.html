<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>辉云易达 OS - 视频浏览</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="gallery-body fade-in">
    <div class="background-glow"></div>
    <div class="gallery-container">
      <header class="gallery-header glass-card">
        <div>
          <h1>辉云易达视频库</h1>
          <p>通过筛选快速定位所需案例，实时预览播放</p>
        </div>
        <div class="header-links">
          <a href="/login" class="primary-btn">控制台登录</a>
        </div>
      </header>

      <section class="filters glass-card">
        <div class="filters-grid" id="primaryFilters"></div>
        <button id="toggleFilters" class="toggle-filters">
          <span class="label">展开更多分类</span>
          <span class="icon">▼</span>
        </button>
        <div class="filters-grid hidden" id="extendedFilters"></div>
        <div class="filters-actions">
          <button id="resetFilters" class="secondary-btn">重置筛选</button>
        </div>
      </section>

      <section class="video-grid" id="videoGrid"></section>
      <p id="noResult" class="no-result hidden">暂无符合条件的视频，尝试调整筛选条件。</p>
    </div>
    <script src="/js/main.js"></script>
  </body>
</html>
